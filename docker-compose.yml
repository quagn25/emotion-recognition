services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectdl-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - USE_GPU=false
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectdl-web-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - USE_GPU=false
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectdl-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - USE_GPU=false
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    profiles:
      - jupyter
